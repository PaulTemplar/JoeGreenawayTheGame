@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#e0e0e0;font-family:'Press Start 2P',system-ui,monospace;font-size:11px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;overflow-x:hidden}
h1{font-size:14px;text-align:center;color:#ffd700;margin:8px 0;text-shadow:2px 2px 0 #333}
h2{font-size:12px;color:#7ec8e3;margin:6px 0;text-align:center}
.screen{width:100%;max-width:420px;display:none;flex-direction:column;align-items:center;gap:10px}
.screen.active{display:flex}
canvas.avatar{image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid #ffd700;background:#111;border-radius:4px}
.info-box,.dialogue-box,.result-box{background:#1a1a1a;border:2px solid #444;padding:12px;width:100%;border-radius:6px}
.dialogue-box{border-color:#7ec8e3;font-size:10px;min-height:70px}
.btn{background:#2a2a2a;color:#fff;border:2px solid #666;padding:12px 8px;width:100%;font-family:inherit;font-size:10px;cursor:pointer;border-radius:4px;text-align:left}
.btn:active{background:#3a3a3a;border-color:#ffd700}
.btn.correct{border-color:#4caf50;background:#1b3a1b}
.btn.wrong{border-color:#f44336;background:#3a1b1b}
.btn.primary{background:#1a3a5c;border-color:#7ec8e3;text-align:center;font-size:11px}
.score-bar{display:flex;justify-content:space-between;width:100%;font-size:10px;color:#aaa;margin-bottom:4px}
.high-score{color:#ffd700}
.muted{color:#888;font-size:9px}
#music-toggle{position:fixed;top:8px;right:8px;background:#222;border:1px solid #555;color:#ccc;font-size:9px;padding:4px 8px;border-radius:3px;z-index:100;font-family:inherit}
.client-avatar{width:128px;height:128px}
.title-joe{width:160px;height:160px}
.choices{width:100%;display:flex;flex-direction:column;gap:8px}
.feedback{text-align:center;padding:8px;font-size:10px}
.good{color:#4caf50}
.bad{color:#f44336}
.warning{color:#ff9800}
.boss-msg{background:#1a2a1a;border:2px solid #4caf50;padding:12px;margin:10px 0;border-radius:6px;color:#a5d6a7;font-size:10px;text-align:center}
footer{margin-top:16px;font-size:8px;color:#555;text-align:center}
</style>
</head>

<button id="music-toggle">Music: ON</button>

  <footer>Made for fun • Not medical advice</footer>
</div>

<div id="game-screen" class="screen">

  <div id="feedback" class="feedback"></div>
</div>

function initAudio(){ if(audioCtx) return; audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSlowMidi(){
  if(!musicOn || !audioCtx) return;
  stopMusic();
  const notes = [196,220,246.94,261.63,293.66,329.63,349.23,392];
  const pattern = [0,2,4,2,3,5,4,2,0,2,3,4,5,4,2,0];
  const tempo = 0.55;
  function schedule(){
    if(!musicOn) return;
    const t0 = audioCtx.currentTime;
    pattern.forEach((nIdx,i)=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = notes[nIdx];
      gain.gain.setValueAtTime(0.0001, t0 + i*tempo);
      gain.gain.linearRampToValueAtTime(0.08, t0 + i*tempo + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + i*tempo + tempo*0.9);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t0 + i*tempo); osc.stop(t0 + i*tempo + tempo);
      oscNodes.push(osc);
    });
    const bass = audioCtx.createOscillator();
    const bg = audioCtx.createGain();
    bass.type = 'sine'; bass.frequency.value = 98; bg.gain.value = 0.04;
    bass.connect(bg); bg.connect(audioCtx.destination);
    bass.start(t0); bass.stop(t0 + pattern.length * tempo);
    oscNodes.push(bass);
    setTimeout(schedule, pattern.length * tempo * 1000 - 50);
  }
  schedule();
}
function stopMusic(){ oscNodes.forEach(o=>{ try{o.stop()}catch(e){} }); oscNodes = []; }

document.getElementById('music-toggle').onclick = ()=>{
  musicOn = !musicOn;
  document.getElementById('music-toggle').textContent = 'Music: ' + (musicOn ? 'ON' : 'OFF');
  if(musicOn){ initAudio(); if(audioCtx.state === 'suspended') audioCtx.resume(); playSlowMidi(); }
  else stopMusic();
};

  ctx.fillStyle = pick(['#3a7ca5','#4a3728','#2e8b57','#555','#1a1a1a']);
  ctx.fillRect(12*s,12*s,2*s,2*s); ctx.fillRect(19*s,12*s,2*s,2*s);
  ctx.fillStyle = hair; ctx.fillRect(11*s,11*s,3*s,s); ctx.fillRect(18*s,11*s,3*s,s);
  ctx.fillStyle = skin; ctx.fillRect(15*s,14*s,2*s,3*s);
  ctx.fillStyle = '#c47a6a';
  if(rand()>0.3){ ctx.fillRect(13*s,18*s,6*s,s); ctx.fillRect(14*s,19*s,4*s,s); } else ctx.fillRect(14*s,18*s,4*s,s);
  if(sex==='male' && rand()>0.55){ ctx.fillStyle = hair; for(let x=12;x<20;x++) ctx.fillRect(x*s,20*s,s,s); for(let x=13;x<19;x++) ctx.fillRect(x*s,21*s,s,s); }
  ctx.fillStyle = pick(['#1a1a1a','#2c3e50','#8b0000','#1a3a5c','#2e4a2e','#4a2c6a','#333']);
  for(let y=24;y<32;y++) for(let x=6;x<26;x++) ctx.fillRect(x*s,y*s,s,s);
  ctx.fillStyle = '#000'; ctx.fillRect(13*s,23*s,6*s,2*s);
}

function randFrom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function getAvailableAilments(sex){
  return ailments.filter(a => {
    const used = (ailmentUseCount[a.id] || 0) < 1;
    const genderOk = !(a.id === "member" || a.id === "erectile" || a.id === "smell") || sex === "male";
    return used && genderOk;
  });
}

function generateClient(){
  if(Math.random() < 0.07){
    const ail = ailments.find(a => a.id === "rotator") || ailments[7];
    return {sex:"male", first:"Fernao", last:"Abreu", age:34+Math.floor(Math.random()*20), occupation:"Jiu Jitsu Coach", ailment:ail, seed:42, isEaster:true,
      friendliness:randFrom(["medium","high"]), promiscuity:randFrom(["low","medium"]), sexuality:"straight", wantsHappy:false};
  }
  const sex = Math.random() < 0.5 ? "male" : "female";
  let available = getAvailableAilments(sex);
  if(available.length === 0){
    showFinalScreen();
    return null;
  }
  const first = sex === "male" ? randFrom(maleFirst) : randFrom(femaleFirst);
  const last = randFrom(surnames);
  const age = 18 + Math.floor(Math.random()*68);
  const occupation = randFrom(occupations);
  const ailment = randFrom(available);
  const seed = Math.floor(Math.random()*100000);
  ailmentUseCount[ailment.id] = 1;

  const friendliness = Math.random() < 0.25 ? "low" : (Math.random() < 0.5 ? "medium" : "high");
  const promiscuity = Math.random() < 0.4 ? "low" : (Math.random() < 0.7 ? "medium" : "high");
  let sexuality;
  if(sex === "male"){
    const r = Math.random();
    sexuality = r < 0.85 ? "straight" : (r < 0.95 ? "gay" : "bi");
  } else {
    const r = Math.random();
    sexuality = r < 0.85 ? "straight" : (r < 0.93 ? "lesbian" : "bi");
  }
  const wantsHappy = (promiscuity === "high" && Math.random() < 0.04);

  return {sex, first, last, age, occupation, ailment, seed, isEaster:false, friendliness, promiscuity, sexuality, wantsHappy};
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function updateScores(){
  document.getElementById('current-score').textContent = currentScore;
  document.getElementById('high-score').textContent = highScore;
  document.getElementById('title-high').textContent = highScore;
}

function startGame(){
  initAudio();
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  if(musicOn) playSlowMidi();
  currentScore = 0; lastBossLevel = 0; ailmentUseCount = {};
  document.getElementById('next-btn').style.display = 'block';
  updateScores();
  nextClient();
}

function goTitle(){ showScreen('title-screen'); updateScores(); }

function showFinalScreen(){
  let message = "";
  if(highScore >= 3000) message = "Message from Phil at Evolution: Outstanding work Joe. You're one of the best we've ever had. The clinic is lucky to have you.";
  else if(highScore >= 2000) message = "Message from Phil at Evolution: Really solid performance today. Keep this up and you'll be senior material soon.";
  else if(highScore >= 1000) message = "Message from Phil at Evolution: Decent shift. A few rough edges but the patients mostly left happy.";
  else if(highScore >= 500) message = "Message from Phil at Evolution: You got through the day. Let's aim a bit higher next time.";
  else message = "Message from Phil at Evolution: That was... eventful. We need to have a chat about professional boundaries.";

  document.getElementById('result-content').innerHTML = `
    <h2 style="color:#ffd700">Clinic Closed</h2>
    <p>Congratulations!</p>
    <p>You have seen every patient.</p>
    <p style="margin:12px 0">Final Score: <span class="high-score">${highScore}</span></p>
    <div class="boss-msg">${message}</div>
  `;
  showScreen('result-screen');
  document.getElementById('next-btn').style.display = 'none';
}

function nextClient(){
  client = generateClient();
  if(!client) return;

  phase = 'diagnosis'; chosenDx = null; chosenTx = null; chosenClose = null; dxPoints = 0; txPoints = 0;
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('phase-label').textContent = 'Choose diagnosis:';
  drawClientFace(document.getElementById('client-avatar'), client.sex, client.seed);
  document.getElementById('client-name').textContent = client.first + ' ' + client.last;
  document.getElementById('client-meta').textContent = client.age + ' • ' + client.sex + ' • ' + client.occupation;

  let dlg = client.ailment.dialogue;
  if(client.isEaster) dlg = "Hello Joe. I've been getting a pain in my right shoulder for a few weeks now. It hurts every time I lift it out to the side or try to reach overhead. Feels weak too. Name's Fernao by the way – I coach jiu jitsu.";
  if(client.wantsHappy) dlg = randFrom(rareFlirty);
  document.getElementById('client-dialogue').textContent = dlg;

  const correct = client.ailment.correctDx[0];
  let options = [correct, ...shuffle(client.ailment.correctDx.slice(1).concat(ailments.filter(a => a.id !== client.ailment.id).map(a => a.correctDx[0]))).slice(0,3)];
  options = shuffle([...new Set(options)]).slice(0,4);
  while(options.length < 4) options.push(randFrom(ailments).correctDx[0]);

  const choicesDiv = document.getElementById('choices');
  choicesDiv.innerHTML = '';
  options.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'btn'; b.textContent = opt;
    b.onclick = () => chooseDiagnosis(opt, correct, b);
    choicesDiv.appendChild(b);
  });
  showScreen('game-screen');
}

function chooseDiagnosis(selected, correct, btn){
  if(phase !== 'diagnosis') return;
  chosenDx = selected;
  const isCorrect = selected === correct;
  dxPoints = isCorrect ? 40 : 0;
  document.querySelectorAll('#choices .btn').forEach(b => {
    b.onclick = null;
    if(b.textContent === correct) b.classList.add('correct');
    else if(b === btn && !isCorrect) b.classList.add('wrong');
  });
  document.getElementById('feedback').innerHTML = isCorrect ? '<span class="good">Correct diagnosis!</span>' : '<span class="bad">Not quite. Correct was: ' + correct + '</span>';
  phase = 'treatment';
  document.getElementById('phase-label').textContent = 'Choose treatment:';

  setTimeout(() => {
    const correctTx = client.ailment.correctTx[0];
    let pool = [...client.ailment.correctTx, ...client.ailment.funnyTx];
    if(Math.random() < 0.4) pool.push('Sensual touching','Amputation','Recommend crystals and positive vibes only');
    let options = [correctTx, ...shuffle(pool.filter(t => t !== correctTx)).slice(0,3)];
    options = shuffle([...new Set(options)]).slice(0,4);
    while(options.length < 4) options.push(randFrom(['Ice pack and hope','Refer to specialist','Ignore it and carry on','Yoga once a year']));

    const choicesDiv = document.getElementById('choices');
    choicesDiv.innerHTML = '';
    options.forEach(opt => {
      const b = document.createElement('button');
      b.className = 'btn'; b.textContent = opt;
      b.onclick = () => chooseTreatment(opt, correctTx, b);
      choicesDiv.appendChild(b);
    });
    document.getElementById('feedback').innerHTML = '';
  }, 900);
}

function chooseTreatment(selected, correct, btn){
  if(phase !== 'treatment') return;
  chosenTx = selected;
  const isCorrect = selected === correct || client.ailment.correctTx.includes(selected);
  txPoints = isCorrect ? 40 : 0;
  document.querySelectorAll('#choices .btn').forEach(b => {
    b.onclick = null;
    if(client.ailment.correctTx.includes(b.textContent)) b.classList.add('correct');
    else if(b === btn && !isCorrect) b.classList.add('wrong');
  });

  let feedbackLines = [];
  if(dxPoints + txPoints >= 80){
    feedbackLines.push(randFrom([
      "That actually makes a lot of sense, thanks Joe.",
      "Brilliant, I feel better already just hearing that.",
      "Finally someone who knows what they're talking about.",
      "Cheers Joe, that clears it up."
    ]));
  } else if(dxPoints + txPoints >= 40){
    feedbackLines.push(randFrom([
      "Hmm, okay... if you say so.",
      "Right... fair enough I guess.",
      "I'll take your word for it.",
      "Alright then.",
      "If that's what you think..."
    ]));
  } else {
    if(Math.random() < 0.55) feedbackLines.push(randFrom(vulgarUnhappy));
    else feedbackLines.push(randFrom([
      "Not sure I follow, but alright.",
      "Whatever you say...",
      "I'm not convinced but go on.",
      "That doesn't sound right to me."
    ]));
  }

  if(client.promiscuity === 'high' && Math.random() < 0.4 && !client.wantsHappy){
    if(client.sex === 'female') feedbackLines.push(randFrom(["You've got nice hands, you know that?","Is it just me or is it warm in here?","You seem very... thorough."]));
    else feedbackLines.push(randFrom(["You're pretty good with your hands.","Do all the physios here look like you?","Interesting technique."]));
  } else if(client.friendliness === 'low' && Math.random() < 0.35){
    feedbackLines.push(randFrom(["Just get on with it.","I haven't got all day.","Whatever."]));
  }

  document.getElementById('client-dialogue').textContent = feedbackLines.join(' ');
  document.getElementById('phase-label').textContent = 'Closing – choose additional service:';
  phase = 'closing';

  const closeOptions = ["Friendly goodbye","Educational advice / home exercises","Show some stretching tips","Offer a \"happy ending\""];
  const choicesDiv = document.getElementById('choices');
  choicesDiv.innerHTML = '';
  closeOptions.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'btn'; b.textContent = opt;
    b.onclick = () => chooseClosing(opt, b);
    choicesDiv.appendChild(b);
  });
  document.getElementById('feedback').innerHTML = '';
}

function chooseClosing(selected, btn){
  if(phase !== 'closing') return;
  chosenClose = selected;
  document.querySelectorAll('#choices .btn').forEach(b => b.onclick = null);

  let closePoints = 0;
  let closeNote = '';

  const isHappy = selected.includes('happy ending');
  const isFriendly = selected === 'Friendly goodbye';
  const isEdu = selected.includes('Educational') || selected.includes('stretching');

  if(isFriendly){
    if(client.friendliness === 'high'){ closePoints += 15; closeNote = 'They appreciated the warm goodbye.'; }
    else if(client.friendliness === 'medium'){ closePoints += 5; closeNote = 'Polite enough.'; }
    else { closePoints -= 20; closeNote = 'They found the friendliness annoying / fake.'; }
  }
  if(isEdu){ closePoints += 10; closeNote = 'Useful advice given. Professional.'; }

  if(isHappy){
    if(client.wantsHappy){
      closePoints += 50;
      closeNote = 'They got exactly what they came for.';
    } else {
      const likesIt = (client.sexuality === 'gay' || client.sexuality === 'lesbian' || client.sexuality === 'bi') && (client.promiscuity === 'medium' || client.promiscuity === 'high');
      const hatesIt = (client.sex === 'male' && client.sexuality === 'straight') || (client.promiscuity === 'low');
      if(likesIt){ closePoints += 35; closeNote = 'They were very satisfied with the... extra service.'; }
      else if(hatesIt){ closePoints -= 40; closeNote = 'They were offended by the unprofessional offer.'; }
      else { closePoints -= 10; closeNote = 'Awkward silence. They declined.'; }
    }
  }

  if((dxPoints + txPoints) < 40 && Math.random() < 0.4){
    closeNote += ' ' + randFrom(vulgarUnhappy);
  }

  let points = dxPoints + txPoints + closePoints;
  if(dxPoints > 0 && txPoints > 0) points += 20;

  const isMassage = chosenTx && (chosenTx.toLowerCase().includes('massage') || chosenTx.toLowerCase().includes('soft tissue') || chosenTx.toLowerCase().includes('manual therapy') || chosenTx.toLowerCase().includes('massage the pain away'));
  let sued = false;
  if(client.sex === 'female' && client.age > 60 && isMassage){
    sued = true; points = 0;
    currentScore = 0; highScore = 0; localStorage.setItem('joeHighScore','0'); lastBossLevel = 0;
  } else {
    currentScore += Math.max(0, points);
    if(currentScore > highScore){ highScore = currentScore; localStorage.setItem('joeHighScore', highScore.toString()); }
  }
  updateScores();

  let bossHtml = '';
  const currentLevel = Math.floor(currentScore / 750);
  if(currentLevel > lastBossLevel && currentScore > 0){
    lastBossLevel = currentLevel;
    bossHtml = '<div class="boss-msg">' + randFrom(bossMessages) + '</div>';
  }

  let html = '<p><strong>' + client.first + ' ' + client.last + '</strong></p><p class="muted">' + client.ailment.name + '</p><br>';
  if(sued){
    html += '<p class="bad">Oh no! ' + client.first + ' complained that the massage caused bruising and intends to sue the physician!</p>';
    html += '<p class="warning">Your score and high score have been reset to zero.</p>';
  } else {
    html += '<p>Diagnosis: ' + (dxPoints > 0 ? '<span class="good">Correct</span>' : '<span class="bad">Incorrect</span>') + '</p>';
    html += '<p>Treatment: ' + (txPoints > 0 ? '<span class="good">Appropriate</span>' : '<span class="bad">Questionable</span>') + '</p>';
    html += '<p>Closing: ' + closeNote + '</p>';
    html += '<p>Points this client: ' + (points >= 0 ? '+' : '') + points + '</p>';
  }
  html += bossHtml + '<p style="margin-top:10px">Running score: ' + currentScore + '</p>';
  document.getElementById('result-content').innerHTML = html;
  showScreen('result-screen');
  phase = 'done';
}

document.getElementById('start-btn').onclick = startGame;
document.getElementById('next-btn').onclick = nextClient;
document.getElementById('title-btn').onclick = goTitle;

drawJoe(document.getElementById('title-joe'));
updateScores();
</script>
</body>
</html>

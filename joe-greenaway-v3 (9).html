*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#e0e0e0;font-family:'Press Start 2P',system-ui,monospace;font-size:11px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;overflow-x:hidden}
h1{font-size:14px;text-align:center;color:#ffd700;margin:8px 0;text-shadow:2px 2px 0 #333}
h2{font-size:12px;color:#7ec8e3;margin:6px 0;text-align:center}
.screen{width:100%;max-width:420px;display:none;flex-direction:column;align-items:center;gap:10px}
.screen.active{display:flex}
canvas.avatar{image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid #ffd700;background:#111;border-radius:4px}
.info-box,.dialogue-box,.result-box{background:#1a1a1a;border:2px solid #444;padding:12px;width:100%;border-radius:6px}
.dialogue-box{border-color:#7ec8e3;font-size:10px;min-height:80px;white-space:pre-wrap}
.btn{background:#2a2a2a;color:#fff;border:2px solid #666;padding:12px 8px;width:100%;font-family:inherit;font-size:10px;cursor:pointer;border-radius:4px;text-align:left;-webkit-tap-highlight-color:transparent}
.btn:active{background:#3a3a3a;border-color:#ffd700}
.btn.correct{border-color:#4caf50;background:#1b3a1b}
.btn.wrong{border-color:#f44336;background:#3a1b1b}
.btn.primary{background:#1a3a5c;border-color:#7ec8e3;text-align:center;font-size:11px}
.score-bar{display:flex;justify-content:space-between;width:100%;font-size:9px;color:#aaa;margin-bottom:4px;gap:6px;flex-wrap:wrap}
.high-score{color:#ffd700}
.muted{color:#888;font-size:9px}
#music-toggle{position:fixed;top:8px;right:8px;background:#222;border:1px solid #555;color:#ccc;font-size:9px;padding:4px 8px;border-radius:3px;z-index:100;font-family:inherit}
.client-avatar{width:128px;height:128px}
.title-joe{width:160px;height:160px}
.choices{width:100%;display:flex;flex-direction:column;gap:8px}
.feedback{text-align:center;padding:8px;font-size:10px}
.good{color:#4caf50}
.bad{color:#f44336}
.warning{color:#ff9800}
.boss-msg{background:#1a2a1a;border:2px solid #4caf50;padding:12px;margin:10px 0;border-radius:6px;color:#a5d6a7;font-size:10px;text-align:center}
.encounter-box{background:#2a1a3a;border:2px solid #9b59b6;padding:14px;width:100%;border-radius:6px}
footer{margin-top:16px;font-size:8px;color:#555;text-align:center}
</style>
</head>

<button id="music-toggle">Music: ON</button>

<div id="title-screen" class="screen active">

  <h2>the interactive game</h2>
  <canvas id="title-joe" class="avatar title-joe" width="160" height="160"></canvas>

  <div class="score-bar"><span>High Score: <span id="title-high" class="high-score">0</span></span></div>
  <button class="btn primary" id="start-btn">START CLINIC</button>
  <p class="muted" style="margin-top:12px;text-align:center">The best thing to happen to physiotherapy in a long time - Happy Ending Magazine</p>
  <footer>Made for fun • Not medical advice</footer>
</div>

<div id="game-screen" class="screen">
  <div class="score-bar">
    <span>Client: <span id="client-progress">1/30</span></span>
    <span>Score: <span id="current-score">0</span></span>

  </div>
  <canvas id="client-avatar" class="avatar client-avatar" width="128" height="128"></canvas>
  <div class="info-box">
    <div id="client-name" style="color:#ffd700;margin-bottom:4px"></div>
    <div id="client-meta" class="muted"></div>
  </div>
  <div class="dialogue-box" id="client-dialogue"></div>
  <div id="phase-label" class="muted" style="align-self:flex-start">Choose diagnosis:</div>
  <div class="choices" id="choices"></div>
  <div id="feedback" class="feedback"></div>
</div>

<div id="result-screen" class="screen">
  <h2 id="result-title">Client Result</h2>
  <div class="result-box" id="result-content"></div>
  <button class="btn primary" id="next-btn">NEXT CLIENT</button>
  <button class="btn" id="title-btn" style="margin-top:8px">Back to Title</button>
</div>

    lotion:{text:"You squeeze a blob of mystery moisturiser onto your palm. It smells like a hotel bathroom and a promise.",choices:[
      {text:"Commit and treat",result:true,rand:true,notes:[
        "Against all clinic law, it works. The head glides, the patient sighs, and you look like a man who planned this. You rinse the probe like it committed a crime. +60",
        "It is far too sticky. The probe stops dead, like it has hit treacle. You lift it and a string of lotion follows, then snaps onto the patient's thigh. They stare at you. 'Is it meant to do chewing gum?' You finish by hand and pretend this is advanced practice. +20",
        "Thirty seconds in they say their skin feels 'warm and interesting'. A faint blotch appears. You wipe it off, abandon the probe, and write 'possible product sensitivity' as if that was the plan all along. +5"
      ]}
    ]},
    shops:{text:"The student sprints out with a twenty and the energy of someone given a quest.",choices:[
      {text:"Stall with conversation until they get back",result:true,points:45,note:"They return pink-faced with proper gel and a meal deal they clearly bought for themselves. The patient got a lecture on load management they did not ask for. Session saved. Student's chicken wrap is not your problem."},
      {text:"Start without them and hope",result:true,points:25,note:"You talk for four minutes about the weather and the patient's dog. The student bursts in mid-sentence. Gel hits the probe. Dignity is only slightly bruised."}
    ]},
    hands:{text:"You put the probe down like it is a toy you have outgrown.\n\n\"We don't need gadgets for this,\" you say, with more confidence than stock levels deserve.",choices:[
      {text:"Treat properly by hand",result:true,points:60,note:"Your hands do the job. The patient says it feels 'more real anyway' and asks if machines are a bit of a gimmick. You do not mention that the gimmick simply ran out."}
    ]},
    borrow:{text:"Next door's receptionist looks at you the way people look at someone asking for a charger.",choices:[
      {text:"Take the gel and run",result:true,points:35,note:"They lend you a half-used bottle 'just this once'. For the next month every corridor chat starts with, 'How's the gel situation, Joe?' You have become a cautionary tale with a pump dispenser."}
    ]}
  }
},
{
  id:"celeb",
  title:"Local Celebrity",
  start:"intro",
  nodes:{
    intro:{text:"A minor local celebrity is in reception with sunglasses indoors.\n\n\"I need privacy. I need the good room. And I need you not to tell anyone I have a perfectly ordinary knee. Can we do that, Joe?\"",choices:[
      {text:"Treat them like everyone else",next:"same"},
      {text:"Give extra privacy",next:"vip"},
      {text:"Ask for a selfie",next:"selfie"},
      {text:"Stay ice cold professional",next:"ice"}
    ]},
    same:{result:true,points:65,note:"You treat the knee like a knee. They take the sunglasses off halfway through and admit they thought you'd fawn. They book a follow-up under their actual name."},
    vip:{result:true,points:45,note:"You clear a room, close blinds, and speak in a whisper. They then want a different pillow, a different time, and a statement that the clinic 'understands talent'. Staff watch you carry the extra pillow like a butler."},
    selfie:{result:true,points:15,note:"They look at you as if you asked to borrow a kidney. Then they take the photo anyway, crop you into the edge, and caption it 'even my physio gets it'. You are a prop with a lanyard."},
    ice:{result:true,points:50,note:"You are polite, brief, and allergic to fame. They call it 'refreshing' in a voice that means 'cold'. A week later their agent sends a fruit basket and a request for 'the blunt one'."}
  }
},
{
  id:"fernaohelp",
  title:"Fernao Needs a Dummy",
  start:"intro",
  nodes:{
    intro:{text:"Fernao Abreu, 45, jiu jitsu coach, appears after hours.\n\n\"Joe. I need a body for a choke video. You game?\"",choices:[
      {text:"Yes",next:"yes"},
      {text:"Only if it's safe",next:"safe"},
      {text:"No",next:"no"},
      {text:"Challenge him to a light roll instead",next:"roll"}
    ]},
    yes:{text:"He grins.\n\n\"Beautiful. Don't tap too early. The algorithm hates that. If you die, tap.\"",choices:[
      {text:"Tap at a sensible time",result:true,points:60,note:"You last long enough for one good angle, then tap like an adult. The video is fine. Your neck sends a formal complaint to your brain. Fernao tags Evolution anyway."},
      {text:"Let him cook",result:true,points:20,note:"The ceiling tiles become a memory. You wake up to Fernao saying 'yes, that's the one'. He is delighted. You check you still have a name."}
    ]},
    safe:{result:true,points:50,note:"He calls you soft, then films a slower demo with a crash mat and a disclaimer. He still tags the clinic. Phil asks why the gym thinks you do after-hours chokes."},
    no:{result:true,points:15,note:"He tells the gym you refused 'because of your shoulders', which is almost a compliment and almost a rumour. White belts ask if you are injured."},
    roll:{result:true,rand:true,notes:[
      "You survive a polite war. He taps your ankle sweep with a nod. Afterwards he says 'ok Joe, you can come to open mat'. Mutual respect, mild bruising. +90",
      "He passes your guard like a weather system. He is kind about it. You lie there thinking about career choices. +40",
      "A teenager films the whole thing. By morning there is a still of your face mid-panic. Fernao says the algorithm will enjoy that. +10"
    ]}
  }
},
{
  id:"aqua",
  title:"Aqua Class Duty",
  major:true,
  start:"intro",
  nodes:{
    intro:{text:"Phil appears with a soggy timetable.\n\n\"Joe. Sandra's off. I need you to take the Aqua class. You know the one. The old, fat people.\"",choices:[
      {text:"Agree to take the class",next:"agree"},
      {text:"Refuse",next:"refuse"}
    ]},
    refuse:{text:"Phil's face hardens.\n\n\"Refuse? In my clinic? Fine. Outside. Now. Evolution car park. Let's see how clever you are without a treatment bed.\"",choices:[
      {text:"Go outside and fight Phil",next:"philfight"},
      {text:"Back down and take the class",next:"agree"}
    ]},
    philfight:{text:"You step into the car park. Phil takes his lanyard off like it is a championship belt.\n\n\"Pick your poison, Joe.\"",choices:[
      {text:"Grapple him",next:"phil_grapple"},
      {text:"Strike him",next:"phil_strike"},
      {text:"Run",next:"phil_run"},
      {text:"Fight dirty",next:"phil_dirty"}
    ]},
    phil_grapple:{text:"You shoot for a clumsy clinch under the Evolution sign.",choices:[
      {text:"See what happens",result:true,rand:true,notes:[
        "You wrap Phil up, trip him onto the tarmac and pin him until he slaps the ground. He wheezes, 'Alright. You win.' Then he books you for two extra Aqua classes anyway. +80",
        "You get the body lock, but Phil hips out and dumps you onto a parking line. He stands over you laughing. 'That's your double-leg, is it?' -30",
        "You both stumble around hugging like drunk uncles until a patient beeps the horn. Phil calls it a draw and still makes you do the class. +10"
      ]}
    ]},
    phil_strike:{text:"You raise your hands. Phil does the same, badly.",choices:[
      {text:"Throw something",result:true,rand:true,notes:[
        "You throw a stiff jab that snaps Phil's head back. He sits on the kerb holding his nose. 'Okay. Point taken. Don't mention this in the team meeting.' +90",
        "You swing for the fences and miss. Phil's wild right hand catches you on the ear. The world tilts. He helps you up just so he can mock you in front of reception. -40",
        "You both throw at the same time, bump foreheads, and swear. A passing bus driver slow-claps. +15"
      ]}
    ]},
    phil_run:{text:"You look at the exit. Phil notices.",choices:[
      {text:"Bolt",result:true,rand:true,notes:[
        "You sprint for the high street. Phil shouts 'COWARD!' so loudly a window opens. You keep your teeth. He deducts the moral victory. -20",
        "You fake a run, then stop. Phil pulls a hamstring chasing you and has to sit down. You win by default and he hates you for it. +55",
        "You run straight into a wheelie bin. Phil films it. -35"
      ]}
    ]},
    phil_dirty:{text:"There are no rules in the Evolution car park.",choices:[
      {text:"Do something unprofessional",result:true,rand:true,notes:[
        "You kick Phil in the shin, then flick his glasses off. He hops in a circle swearing. You look terrible. You also win. +70",
        "You go for the eyes. Phil is ready and slaps you so hard your lanyard spins. He leans in: 'That's why I'm the boss.' -45",
        "You throw a handful of gravel. The wind blows it back into both of you. Nobody wins. The CCTV does. +5"
      ]}
    ]},
    agree:{text:"The pool smells of chlorine and resignation. A dozen older, heavier clients bob in the water waiting for instruction.\n\nHow do you run it?",choices:[
      {text:"Do a boring, safe class",next:"boring"},
      {text:"Do an exciting class",next:"exciting"},
      {text:"Do an abusive class",next:"abusive"}
    ]},
    boring:{text:"You lead twenty minutes of gentle figure-eights. An old woman at the back raises a wrinkled hand.\n\n\"This is rubbish. I could get this from a radio. I want my money back, or a refund in sweat.\"",choices:[
      {text:"Apologise and spice it up a bit",result:true,points:40,note:"You add a few bigger movements. She nods like a headmistress. The class survives. Phil later calls it 'adequate'."},
      {text:"Tell her this is what Aqua is supposed to be",result:true,points:15,note:"She huffs, does one more arm circle, and tells the changing room you have 'no spark'."},
      {text:"Offer her a free tea after class",result:true,points:35,note:"Bribery works. She accepts the tea and withdraws the complaint. Just."}
    ]},
    exciting:{text:"You crank the music and turn the class into a splash-heavy circuit. Water hits the ceiling tiles. A few people look twenty years younger. One person looks twenty years older.",choices:[
      {text:"See how it lands",randomNext:["heart","praise"]}
    ]},
    heart:{text:"An old man near the steps goes grey, clutches his chest and slumps against the rail.\n\nThe class freezes. Someone shouts his name. Phil is nowhere.",choices:[
      {text:"Get him out and start first aid",next:"heart_aid"},
      {text:"Scream for reception to call 999",next:"heart_999"},
      {text:"Panic and keep the class moving",next:"heart_panic"}
    ]},
    heart_aid:{text:"You haul him onto the poolside. He is breathing, just. You talk to him, keep him sat up, and wait for the ambulance.",choices:[
      {text:"Stay with him until they arrive",result:true,points:100,note:"The paramedics take over. He squeezes your wrist and whispers that the class was 'too good'. Phil later says you handled it 'better than expected'."},
      {text:"Hand him to a colleague and hide",result:true,points:20,note:"He survives. You survive. Nobody calls you a hero."}
    ]},
    heart_999:{text:"Reception actually answers. Sirens follow. The class huddles in the water like frightened seals.",choices:[
      {text:"Keep him talking until help arrives",result:true,points:80,note:"He makes it. The story in town becomes 'Joe's killer Aqua class', which is only half a compliment."}
    ]},
    heart_panic:{result:true,points:-50,note:"You clap and shout 'and back to the grapevine!' while a man has a cardiac event. Someone films it. Phil finds you afterwards."},
    praise:{text:"The class actually loves it. They clap in the water, which is a wet, useless sound.\n\nA large woman beams at you. \"Joe, that was the best hour of my week. Come here.\"",choices:[
      {text:"Accept the praise professionally",result:true,points:70,note:"You thank them, book a few of them into clinic, and escape before anyone tries to adopt you."},
      {text:"Let them buy you tea after",result:true,points:55,note:"You spend twenty minutes hearing about hips, widows and grandchildren. Your score rises. Your afternoon dies."},
      {text:"Get carried away and promise a weekly 'extreme Aqua'",result:true,points:25,note:"They cheer. Phil hears. You are now on the timetable forever."}
    ]},
    abusive:{text:"You stand on the poolside with your arms folded.\n\n\"If you wanted a gentle paddle you should have stayed on the sofa. Move.\"",choices:[
      {text:"See how they take it",randomNext:["offend","workhard","poolfight"]}
    ]},
    offend:{text:"A woman in a floral cap stares at you.\n\n\"How dare you. We pay for this. We are not cattle.\"",choices:[
      {text:"Apologise",result:true,points:20,note:"You backtrack. She accepts it through gritted teeth and tells two friends you are 'a bit nasty'."},
      {text:"Double down",result:true,points:-25,note:"Three people get out. One leaves a review titled 'fatphobic fish'. Phil forwards it to you with no comment."}
    ]},
    workhard:{text:"Oddly, it works. They splash harder, red-faced and determined.\n\n\"Again,\" somebody wheezes, like this is the Olympics.",choices:[
      {text:"Keep the pressure on, but less cruel",result:true,points:60,note:"They finish exhausted and proud. One man shakes your hand with a wet slap and says nobody has shouted at him since the army."},
      {text:"Tell them they still look lazy",result:true,points:-10,note:"The mood snaps. Someone bursts into tears in the deep end. You invent a reason to end class early."}
    ]},
    poolfight:{text:"An old man with a gold chain and a veteran's scowl climbs the steps dripping.\n\n\"Come on then, sunshine. Say that about my wife again.\"\n\nYou are now fighting an old man by the side of the pool.",choices:[
      {text:"Grapple him",next:"old_grapple"},
      {text:"Strike him",next:"old_strike"},
      {text:"Run",next:"old_run"},
      {text:"Fight dirty",next:"old_dirty"}
    ]},
    old_grapple:{text:"He is slippery. You are on wet tiles. This is already a bad idea.",choices:[
      {text:"Go for it",result:true,rand:true,notes:[
        "You grab his soggy shoulders and dump him onto a coil of lane rope. He wheezes, taps the tiles, and mutters that you 'wrestle alright for a stretchy boy'. +75",
        "He hip-tosses you with surprising violence. You hit the poolside on your back and see the fluorescent lights. He leans over. 'That's for Sandra.' -40",
        "You both slip, land in the water, and have to be separated by a lifeguard who is sixteen. +10"
      ]}
    ]},
    old_strike:{text:"He raises two fists like a 1970s boxer. You do the same.",choices:[
      {text:"Throw a punch",result:true,rand:true,notes:[
        "You attempt to throw a wild punch at the angry old man. It connects flush to his jaw and he falls backwards, his head hitting the poolside tiles. He might be dead. He isn't. He sits up swearing. You have won a fight you should not have started. +85",
        "You swing. He doesn't. His forehead meets your nose. Blood hits the chlorine. He tells the class you 'started it'. -45",
        "You both miss. A woman in a swim cap hits you with a pool noodle until it stops. +5"
      ]}
    ]},
    old_run:{text:"The fire exit looks very attractive.",choices:[
      {text:"Run along the poolside",result:true,rand:true,notes:[
        "You make it to the changing rooms. He shouts that you are a disgrace to physiotherapy. He is not entirely wrong. -20",
        "You slip, he slips, and the chase ends in a heap of kickboards. The class applauds the slapstick. +25",
        "You run, he throws a float after you, and it hits Phil, who has just arrived. -30"
      ]}
    ]},
    old_dirty:{text:"There is a wet floor sign. There are goggles. There are no ethics committees present.",choices:[
      {text:"Fight dirty",result:true,rand:true,notes:[
        "You kick water in his face and shove him back into the shallow end. He surfaces coughing and points at you like a drowned referee. The class is horrified. You are still standing. +50",
        "You go for the gold chain. He headbutts you. Your vision fills with chlorine and regret. -40",
        "You both grab the same kickboard and wrestle it like a prize fish. Nobody looks cool. +10"
      ]}
    ]}
  }
},
{
  id:"printer",
  title:"The Printer Uprising",
  start:"intro",
  nodes:{
    intro:{text:"Reception shouts through the door.\n\n\"Joe, the printer has eaten the discharge letters again. Phil says you are 'good with tech'.\"\n\nThe machine is flashing red and making a noise like a dying kettle.",choices:[
      {text:"Try the official fix",next:"official"},
      {text:"Hit it",next:"hit"},
      {text:"Unplug everything",next:"unplug"},
      {text:"Blame the student",next:"blame"}
    ]},
    official:{text:"You follow the on-screen wizard. It asks if you want to install firmware from 2014.",choices:[
      {text:"Say yes",result:true,points:45,note:"It prints one perfect page, then a blank one, then a page that just says 'HELP'. Phil calls that a win."},
      {text:"Say no and walk away",result:true,points:10,note:"The letters stay eaten. Reception adds your name to the printer curse."}
    ]},
    hit:{text:"You give it a measured tap. Then a less measured one.",choices:[
      {text:"One more for luck",result:true,rand:true,notes:["A jam clears. Letters pour out. You are briefly a god. +70","A plastic flap snaps off. Phil invoices the clinic to himself. +15","It prints 40 copies of someone's pelvic floor notes. -10"]}
    ]},
    unplug:{result:true,points:35,note:"You unplug it, wait ten seconds, plug it back in. It works. You tell nobody how simple that was."},
    blame:{result:true,points:5,note:"The student was in the pool. Everyone knows. You look small."}
  }
},
{
  id:"waiting",
  title:"Waiting Room Diplomat",
  start:"intro",
  nodes:{
    intro:{text:"Two patients are arguing over the last upright chair. One has crutches. One has a loud opinion about 'queue jumpers'.\n\nReception mouths 'please' at you.",choices:[
      {text:"Offer the treatment room chair",next:"offer"},
      {text:"Invent a clinic policy on the spot",next:"policy"},
      {text:"Let them fight it out",next:"fight"},
      {text:"Give both of them tea",next:"tea"}
    ]},
    offer:{text:"You wheel out a stool. The crutches patient sits. The other one looks cheated.",choices:[
      {text:"Explain you were being practical",result:true,points:60,note:"The room calms. Reception owes you a biscuit."},
      {text:"Offer the complainer an earlier slot",result:true,points:40,note:"They sit down, smug. Your next hour is now tighter."}
    ]},
    policy:{result:true,points:50,note:"You announce 'mobility first'. It sounds official enough that both of them nod."},
    fight:{result:true,points:-15,note:"Someone's umbrella becomes involved. Phil asks why the waiting room looks like a jumble sale."},
    tea:{result:true,points:35,note:"Tea solves 60 percent of British conflict. The chair is still a problem, but quieter."}
  }
},
{
  id:"cqc",
  title:"Surprise Paperwork Raid",
  start:"intro",
  nodes:{
    intro:{text:"A clipboard appears in reception. Not a patient. An audit person.\n\n\"Just a quick look at consent forms,\" they smile, in the way sharks smile.",choices:[
      {text:"Show them the real notes",next:"real"},
      {text:"Stall while you tidy",next:"stall"},
      {text:"Send them to Phil",next:"phil"},
      {text:"Over-explain pain science for ten minutes",next:"lecture"}
    ]},
    real:{text:"Most of it is fine. One page has 'happy ending???' written in the margin in what is definitely your handwriting.",choices:[
      {text:"Call it a joke and black it out",result:true,points:30,note:"They make a note. Not a good note. You survive."},
      {text:"Own it as 'patient-reported goals'",result:true,points:55,note:"You talk fast enough that it becomes 'shared decision making'. Phil later asks you never to do that again."}
    ]},
    stall:{result:true,rand:true,notes:["You hide the weird page. The rest looks gleaming. +65","They notice you stalling and look harder. +15"]},
    phil:{result:true,points:25,note:"Phil handles it with corporate warmth. He later says you 'delegated well', which means he is annoyed."},
    lecture:{result:true,points:40,note:"They glaze over, tick a box, and leave. Pain science: 1. Clipboard: 0."}
  }
},
{
  id:"lactic",
  title:"Lactic Acid Playboy",
  start:"intro",
  nodes:{
    intro:{text:"An old man marches in smelling of aftershave and last night.\n\n\"Joe. Lactic acid. Everywhere. Since the wife passed I've been out almost every night. Flashing the money. A bit of cocaine with the younguns. Trying to get them back to mine. The dancing and the shagging have me sore as sin. I need it flushed out.\"",choices:[
      {text:"Advise him to stop the party lifestyle",next:"advise"},
      {text:"Give him a full body massage",next:"massage"},
      {text:"Ask to hear some of his stories",next:"stories"}
    ]},
    advise:{text:"You tell him the soreness is load, sleep and age, not a tank of lactic acid, and that nights out, powder and no rest are a bad mix.\n\nHe bristles.\n\n\"I'm trying to live life to the full, son. She wouldn't have wanted me sat in that house with the curtains shut. You lot want everyone in bed by nine.\"\n\nHe gets louder, tapping his own chest to make the point.",choices:[
      {text:"Keep arguing that he needs to slow down",next:"collapse_argue"}
    ]},
    massage:{text:"The man lies on his front and you begin to work some of the tension from his shoulders. He groans like a man who has found religion in a plinth.\n\n\"That's it. That's the stuff. The girls last night hadn't got a clue.\"\n\nYou move down the upper back. Mid-stroke, he goes quiet. No joke. No breath comment. Nothing.",choices:[
      {text:"Ask if he's alright",next:"collapse_massage"}
    ]},
    stories:{text:"He sits forward, delighted.\n\n\"Tuesday was the salsa night. Woman half my age. Thursday I spent more on bottles than you've earned this week. Friday I thought I was having a heart attack in a taxi but it was just the kebab. Anyway, so this one lass says to me...\"\n\nHe stops midway through the story. Blank face. Then he clutches his chest and slides off the chair.",choices:[
      {text:"Grab him before he hits the floor",next:"collapse_story"}
    ]},
    collapse_argue:{text:"He is mid-sentence about living life to the full when the colour drops out of his face. He clutches his chest, folds, and hits the floor of the treatment room. He does not get up. There is no pulse you can find.",choices:[
      {text:"Call an ambulance",next:"ambulance"},
      {text:"Attempt CPR",next:"cpr"},
      {text:"Go get Phil",next:"philhelp"},
      {text:"Embalm him in baby oil",next:"oil"},
      {text:"Try to cover it up",next:"cover"}
    ]},
    collapse_massage:{text:"You take your hands off. You say his name. You shake his shoulder. He does not respond. You roll him and he is a dead weight on the plinth. The clinic clock keeps ticking like nothing happened.",choices:[
      {text:"Call an ambulance",next:"ambulance"},
      {text:"Attempt CPR",next:"cpr"},
      {text:"Go get Phil",next:"philhelp"},
      {text:"Embalm him in baby oil",next:"oil"},
      {text:"Try to cover it up",next:"cover"}
    ]},
    collapse_story:{text:"He is on the floor between the chair and the plinth, still wearing the expression of a man who had one more story. He is gone. Reception has not noticed yet. Your hands are shaking.",choices:[
      {text:"Call an ambulance",next:"ambulance"},
      {text:"Attempt CPR",next:"cpr"},
      {text:"Go get Phil",next:"philhelp"},
      {text:"Embalm him in baby oil",next:"oil"},
      {text:"Try to cover it up",next:"cover"}
    ]},
    ambulance:{result:true,rand:true,notes:[
      "You call it in immediately and stay on the line. Paramedics take over. Later a daughter thanks you for not leaving him on the floor like a rumour. Phil says you did the only decent thing. +80",
      "You call 999. They arrive fast enough for paperwork and not for miracles. Reception is quiet for the rest of the day. Nobody blames you. Nobody thanks you either. +0",
      "You freeze for a minute before you dial. A waiting patient hears the call. By evening the town version is that people die in Joe's room. Your name comes up in the wrong conversations. -40"
    ]},
    cpr:{result:true,rand:true,notes:[
      "You start CPR and shout for reception. It does not bring him back, but a paramedic later says the timing and the effort were right. Phil puts a hand on your shoulder and tells you to take the next slot off. +70",
      "You do what you were taught. He does not come back. You sit on the floor with sore wrists. Phil writes the incident up as handled. No praise, no blame. +0",
      "You panic and the compressions are a mess. A first-aider from the waiting room takes over and looks at you like you are in the way. The story becomes that the physio froze. -50"
    ]},
    philhelp:{result:true,rand:true,notes:[
      "You get Phil. He goes pale, then useful. He takes the phone, the notes, the family. Afterwards he says he is glad you did not try to be a hero alone. +60",
      "Phil arrives, swears once, and takes over the admin. You both stand there like men who have run out of jokes. The clinic closes early. Your score does not move. +0",
      "You bolt to find Phil and leave the door open. A child in reception sees too much. Phil is furious that you made it a corridor event. -45"
    ]},
    oil:{result:true,rand:true,notes:[
      "You grab the baby oil in a panic and start talking like this is a spa. Phil walks in, sees what you are doing, and takes the bottle off you. He covers for you with the ambulance story and then bans you from the cupboard. You got away with the stupidity. Barely. +15",
      "You pour oil on a dead man because your brain has left the building. Nobody else comes in. You wipe it off before the paramedics arrive and never speak of it. Phil only knows there was a collapse. +0",
      "Reception opens the door on you, a bottle, and a body. There is no version of that sentence that helps your reputation. Phil sends you home. People talk. -80"
    ]},
    cover:{result:true,rand:true,notes:[
      "You lock the door and stand there doing nothing useful, which is not a plan. Phil knocks, sees the truth immediately, and takes the phone off you. He later says the fact you froze is ugly, but the fact you did not invent a story is why you still have a job. +20",
      "You close the blinds and tell reception the slot is running long. You do not move him. You do not hide anything. You just sit with it until you lose your nerve and call. It is a bad hour that becomes an ordinary tragedy on paper. +0",
      "You try to make it 'not your problem' and stall. Someone from reception comes looking. The delay looks like guilt even though it was a collapse. Phil is grim. Your name is now attached to the worst afternoon the clinic has had. -100"
    ]}
  }
},
{
  id:"bruise",
  title:"Bruising Complaint",
  major:true,
  start:"intro",
  nodes:{
    intro:{text:"An elderly woman plants herself in your doorway, handbag first.\n\n\"YOU. Look at my arms. Look at my thighs. Black and blue. After YOUR session. I have photos. I have a solicitor. I have time.\"\n\nShe does, in fact, have photos. They are on a phone with the brightness at maximum.",choices:[
      {text:"Apologise and inspect the marks properly",next:"inspect"},
      {text:"Explain that some people bruise easily",next:"bruiseeasy"},
      {text:"Suggest her weight made the pressure marks worse",next:"weight"},
      {text:"Offer tea and a quiet room",next:"tea"}
    ]},
    inspect:{text:"The marks are real. They look like finger-shaped blotches over the spots you treated.\n\n\"Well?\" she says. \"Going to pretend that is normal?\"",choices:[
      {text:"Admit the pressure was too much and document it",next:"admit"},
      {text:"Say it is a known side effect of soft tissue work",next:"sidefx"},

function randFrom(arr){return arr[Math.floor(Math.random()*arr.length)]}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function normText(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
function isNonPhysioLine(s){
  const t=normText(s);
  const keys=["isn t a physiotherapy","isnt a physiotherapy","not a physiotherapy","not a primary physiotherapy","not a musculoskeletal","not musculoskeletal","not something i treat","isn t my job","isnt my job","that isn t my job","that isnt my job","isn t really my area","isnt really my area","do not examine","do not attempt","not a condition requiring","no pathological diagnosis","not something i treat directly"];
  return keys.some(function(k){return t.indexOf(k)!==-1;});
}
function tooSimilar(a,b){
  if(!a||!b) return false;
  if(normText(a)===normText(b)) return true;
  if(isNonPhysioLine(a)&&isNonPhysioLine(b)) return true;
  return false;
}
function pickDistinctOptions(correct, pool, fallback){
  const out=[correct];
  const seen={}; seen[normText(correct)]=true;
  shuffle(pool.slice()).forEach(function(item){
    if(out.length>=4) return;
    if(!item || seen[normText(item)]) return;
    if(tooSimilar(correct,item)) return;
    if(out.some(function(existing){return tooSimilar(existing,item);})) return;
    seen[normText(item)]=true;
    out.push(item);
  });
  let guard=0;
  while(out.length<4 && guard<80){
    guard++;
    const item=randFrom(fallback);
    if(!item || seen[normText(item)]) continue;
    if(tooSimilar(correct,item)) continue;
    if(out.some(function(existing){return tooSimilar(existing,item);})) continue;
    seen[normText(item)]=true;
    out.push(item);
  }
  const extras=["Ice pack and hope","Refer to specialist","Ignore it and carry on","Yoga once a year","Buy new shoes","Take up knitting"];
  let i=0;
  while(out.length<4 && i<extras.length){
    const item=extras[i++];
    if(seen[normText(item)]||tooSimilar(correct,item)) continue;
    out.push(item);
  }
  return shuffle(out);
}

function startGame(){
  initAudio(); if(musicOn) playSlowMidi();
  currentScore=0; lastBossLevel=0; ailmentUseCount={}; clientCount=0; fernaoVisits=0; usedFernaoLater=[];
  encountersTriggered=0; usedEncounterIds=[]; majorsThisRun=0; minorsThisRun=0;
  let recent=[];
  try{ recent=JSON.parse(localStorage.getItem('joeRecentEncounters')||'[]'); }catch(e){ recent=[]; }
  if(!Array.isArray(recent)) recent=[];
  const majors=encounters.filter(function(e){ return e.major; });
  const minors=encounters.filter(function(e){ return !e.major; });
  function preferFresh(list){
    const fresh=shuffle(list.filter(function(e){ return recent.indexOf(e.id)===-1; }));
    const leftover=shuffle(list.filter(function(e){ return recent.indexOf(e.id)!==-1; }));
    return fresh.concat(leftover);
  }
  majorDeck=preferFresh(majors);
  minorDeck=preferFresh(minors);
  const slotPool=shuffle([6,8,11,14,17,20,23,25]);
  plannedSlots=[];
  if(majorDeck.length) plannedSlots.push({count:slotPool[0], type:'major'});
  if(minorDeck.length) plannedSlots.push({count:slotPool[1], type:'minor'});
  if(minorDeck.length>1) plannedSlots.push({count:slotPool[2], type:'minor'});
  document.getElementById('next-btn').style.display='block';
  document.getElementById('result-title').textContent='Client Result';
  updateScores(); nextClient();
}

function maybeTriggerEncounter(){
  if(majorsThisRun>=1 && minorsThisRun>=2) return false;
  const plan=plannedSlots.find(function(s){ return s.count===clientCount && !s.used; });
  if(!plan) return false;
  let enc=null;
  if(plan.type==='major' && majorsThisRun<1) enc=majorDeck.shift();
  if(plan.type==='minor' && minorsThisRun<2) enc=minorDeck.shift();
  if(!enc) return false;
  plan.used=true;
  usedEncounterIds.push(enc.id);
  encountersTriggered++;
  if(enc.major) majorsThisRun++; else minorsThisRun++;
  try{ localStorage.setItem('joeRecentEncounters', JSON.stringify(usedEncounterIds)); }catch(e){}
  startEncounter(enc);
  return true;
}

function startEncounter(enc){
  currentEncounter=enc;
  currentNodeId=enc.start;
  phase='encounter';
  document.getElementById('client-name').textContent=enc.title;
  document.getElementById('client-meta').textContent=enc.major?'MAJOR ENCOUNTER':'Minor encounter';
  document.getElementById('phase-label').textContent='What do you do?';
  document.getElementById('feedback').innerHTML='';
  const femaleEnc={housecall:1,bruise:1};
  drawClientFace(document.getElementById('client-avatar'), femaleEnc[enc.id]?'female':'male', 777+enc.id.length);
  renderEncounterNode();
  showScreen('game-screen');
}

function resolveEncounterOutcome(obj){
  if(!obj){ return {points:0, note:'Nothing happens.'}; }
  if(obj.rand && obj.notes && obj.notes.length){
    const pick=randFrom(obj.notes);
    const m=String(pick).match(/([+-]\d+)\s*$/);
    const pts=m?parseInt(m[1],10):10;
    const note=String(pick).replace(/\s*[+-]\d+\s*$/,'');
    return {points:pts, note:note};
  }
  return {points:(typeof obj.points==='number'?obj.points:0), note:obj.note||'The moment passes.'};
}

function renderEncounterNode(){
  const node=currentEncounter.nodes[currentNodeId];
  if(!node){finishEncounter(20,'The moment passes.');return;}
  if(node.result){
    const out=resolveEncounterOutcome(node);
    finishEncounter(out.points, out.note);
    return;
  }
  document.getElementById('client-dialogue').textContent=node.text;
  const box=document.getElementById('choices');
  box.innerHTML='';
  (node.choices||[]).forEach(function(ch){
    const b=document.createElement('button');
    b.className='btn';
    b.textContent=ch.text;
    b.onclick=function(){ pickEncounterChoice(ch); };
    box.appendChild(b);
  });
}

function pickEncounterChoice(ch){
  if(ch.randomNext && ch.randomNext.length){
    currentNodeId=randFrom(ch.randomNext);
    const next=currentEncounter.nodes[currentNodeId];
    if(next && next.result && !next.choices){
      const out=resolveEncounterOutcome(next);
      finishEncounter(out.points, out.note);
    } else {
      renderEncounterNode();
    }
    return;
  }
  if(ch.result){
    const out=resolveEncounterOutcome(ch);
    finishEncounter(out.points, out.note);
    return;
  }
  if(ch.next){
    currentNodeId=ch.next;
    const next=currentEncounter.nodes[currentNodeId];
    if(next && next.result && !next.choices){
      const out=resolveEncounterOutcome(next);
      finishEncounter(out.points, out.note);
    } else {
      renderEncounterNode();
    }
  }
}

function finishEncounter(points, note){
  currentScore+=points;
  if(currentScore<0) currentScore=0;
  if(currentScore>highScore){highScore=currentScore;safeSetHighScore(highScore);}
  updateScores();
  document.getElementById('result-title').textContent='Encounter Result';
  document.getElementById('result-content').innerHTML='<div class="encounter-box"><strong>'+(currentEncounter?currentEncounter.title:'Encounter')+'</strong><br><br>'+note+'<br><br>Points: '+(points>=0?('+'+points):points)+'</div>';
  showScreen('result-screen');
  phase='encounter-done';
}

function resolveHappy(choice){
  let points=10, note='They look at you like you are an idiot, then leave.';
  if(choice.indexOf('professional clinic')!==-1){points=25;note='They respect the boundary. Mostly.';}
  else if(choice.indexOf('Lock the door')!==-1){points=70;note='Things escalate. You gain a story and some points.';}
  else if(choice.indexOf('professional treatment')!==-1){points=40;note='You keep it professional. They accept it, slightly disappointed.';}
  else if(choice.indexOf('Flirt back')!==-1){points=55;note='They like the energy. The session becomes very friendly.';}
  currentScore+=points;
  if(currentScore>highScore){highScore=currentScore;safeSetHighScore(highScore);}
  updateScores();
  document.getElementById('result-content').innerHTML='<p><strong>'+client.first+' '+client.last+'</strong></p><p class="muted">Here for a happy ending</p><br><p>'+note+'</p><p>Points: +'+points+'</p>';
  showScreen('result-screen');
  phase='done';
}

function chooseDiagnosis(selected,correct,btn){
  if(phase!=='diagnosis') return;
  const isCorrect=selected===correct;
  dxPoints=isCorrect?40:0;
  document.querySelectorAll('#choices .btn').forEach(function(b){b.onclick=null;if(b.textContent===correct)b.classList.add('correct');else if(b===btn&&!isCorrect)b.classList.add('wrong');});
  document.getElementById('feedback').innerHTML=isCorrect?'<span class="good">Correct diagnosis!</span>':'<span class="bad">Not quite. Correct was: '+correct+'</span>';
  phase='treatment';
  document.getElementById('phase-label').textContent='Choose treatment:';
  setTimeout(function(){
    const correctTx=client.ailment.correctTx[0];
    let pool=client.ailment.funnyTx.concat(client.ailment.correctTx.slice(1));
    if(Math.random()<0.4) pool=pool.concat(['Sensual touching','Amputation','Recommend crystals and positive vibes only']);
    const options=pickDistinctOptions(correctTx, pool, ['Ice pack and hope','Refer to specialist','Ignore it and carry on','Yoga once a year','Ban the activity forever','Sleep on it']);
    const choicesDiv=document.getElementById('choices');
    choicesDiv.innerHTML='';
    options.forEach(function(opt){
      const b=document.createElement('button');
      b.className='btn'; b.textContent=opt;
      b.onclick=function(){ chooseTreatment(opt,correctTx,b); };
      choicesDiv.appendChild(b);
    });
    document.getElementById('feedback').innerHTML='';
  },900);
}

function chooseTreatment(selected,correct,btn){
  if(phase!=='treatment') return;
  chosenTx=selected;
  const isCorrect=selected===correct||client.ailment.correctTx.indexOf(selected)!==-1;
  txPoints=isCorrect?40:0;
  document.querySelectorAll('#choices .btn').forEach(function(b){b.onclick=null;if(client.ailment.correctTx.indexOf(b.textContent)!==-1)b.classList.add('correct');else if(b===btn&&!isCorrect)b.classList.add('wrong');});
  let feedbackLines=[];
  if(dxPoints+txPoints>=80) feedbackLines.push(randFrom(["That actually makes a lot of sense, thanks Joe.","Brilliant, I feel better already just hearing that.","Finally someone who knows what they're talking about.","Cheers Joe, that clears it up."]));
  else if(dxPoints+txPoints>=40) feedbackLines.push(randFrom(["Hmm, okay... if you say so.","Right... fair enough I guess.","I'll take your word for it.","Alright then."]));
  else { if(Math.random()<0.55) feedbackLines.push(randFrom(vulgarUnhappy)); else feedbackLines.push(randFrom(["Not sure I follow, but alright.","Whatever you say...","I'm not convinced but go on."])); }
  if(client.promiscuity==='high'&&Math.random()<0.4&&!client.wantsHappy){
    feedbackLines.push(client.sex==='female'?randFrom(["You've got nice hands, you know that?","Is it just me or is it warm in here?"]):randFrom(["You're pretty good with your hands.","Interesting technique."]));
  } else if(client.friendliness==='low'&&Math.random()<0.35){
    feedbackLines.push(randFrom(["Just get on with it.","I haven't got all day.","Whatever."]));
  }
  document.getElementById('client-dialogue').textContent=feedbackLines.join(' ');
  document.getElementById('phase-label').textContent='Closing – choose additional service:';
  phase='closing';
  const closeOptions=["Friendly goodbye","Educational advice / home exercises","Show some stretching tips","Offer a \"happy ending\""];
  const choicesDiv=document.getElementById('choices');
  choicesDiv.innerHTML='';
  closeOptions.forEach(function(opt){
    const b=document.createElement('button');
    b.className='btn'; b.textContent=opt;
    b.onclick=function(){ chooseClosing(opt); };
    choicesDiv.appendChild(b);
  });
  document.getElementById('feedback').innerHTML='';
}

function chooseClosing(selected){
  if(phase!=='closing') return;
  document.querySelectorAll('#choices .btn').forEach(function(b){b.onclick=null;});
  let closePoints=0, closeNote='';
  const isHappy=selected.indexOf('happy ending')!==-1;
  const isFriendly=selected==='Friendly goodbye';
  const isEdu=selected.indexOf('Educational')!==-1||selected.indexOf('stretching')!==-1;
  if(isFriendly){
    if(client.friendliness==='high'){closePoints+=15;closeNote='They appreciated the warm goodbye.';}
    else if(client.friendliness==='medium'){closePoints+=5;closeNote='Polite enough.';}
    else {closePoints-=20;closeNote='They found the friendliness annoying.';}
  }
  if(isEdu){closePoints+=10;closeNote='Useful advice given. Professional.';}
  if(isHappy){
    const likesIt=(client.sexuality==='gay'||client.sexuality==='lesbian'||client.sexuality==='bi')&&(client.promiscuity==='medium'||client.promiscuity==='high');
    const hatesIt=(client.sex==='male'&&client.sexuality==='straight')||client.promiscuity==='low';
    if(likesIt){closePoints+=35;closeNote='They were very satisfied with the extra service.';}
    else if(hatesIt){closePoints-=40;closeNote='They were offended by the unprofessional offer.';}
    else {closePoints-=10;closeNote='Awkward silence. They declined.';}
  }
  if((dxPoints+txPoints)<40 && Math.random()<0.4) closeNote+=' '+randFrom(vulgarUnhappy);
  let points=dxPoints+txPoints+closePoints;
  if(dxPoints>0&&txPoints>0) points+=20;
  const isMassage=chosenTx&&(chosenTx.toLowerCase().indexOf('massage')!==-1||chosenTx.toLowerCase().indexOf('soft tissue')!==-1||chosenTx.toLowerCase().indexOf('manual therapy')!==-1);
  let sued=false;
  if(client.sex==='female'&&client.age>=65&&isMassage){
    sued=true; points=0; currentScore=0; highScore=0; safeSetHighScore(0); lastBossLevel=0;
  } else {
    currentScore+=Math.max(0,points);
    if(currentScore>highScore){highScore=currentScore;safeSetHighScore(highScore);}
  }
  updateScores();
  let bossHtml='';
  const currentLevel=Math.floor(currentScore/750);
  if(currentLevel>lastBossLevel&&currentScore>0){lastBossLevel=currentLevel;bossHtml='<div class="boss-msg">'+randFrom(bossMessages)+'</div>';}
  let html='<p><strong>'+client.first+' '+client.last+'</strong></p><p class="muted">'+client.ailment.name+'</p><br>';
  if(sued) html+='<p class="bad">Oh no! '+client.first+' complained that the massage caused bruising and intends to sue!</p><p class="warning">Score and high score reset to zero.</p>';
  else html+='<p>Diagnosis: '+(dxPoints>0?'<span class="good">Correct</span>':'<span class="bad">Incorrect</span>')+'</p><p>Treatment: '+(txPoints>0?'<span class="good">Appropriate</span>':'<span class="bad">Questionable</span>')+'</p><p>Closing: '+closeNote+'</p><p>Points this client: '+(points>=0?'+':'')+points+'</p>';
  html+=bossHtml+'<p style="margin-top:10px">Running score: '+currentScore+'</p>';
  document.getElementById('result-content').innerHTML=html;
  showScreen('result-screen');
  phase='done';
}

document.getElementById('start-btn').onclick=startGame;
document.getElementById('next-btn').onclick=nextClient;
document.getElementById('title-btn').onclick=goTitle;
drawJoe(document.getElementById('title-joe'));
updateScores();
</script>
